<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Visualizer | United Stone &amp; Cabinet</title>
<meta name="description" content="Try United Stone & Cabinet quartz and cabinet colors in a real room.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../">United Stone &amp; Cabinet</a>
  <span class="spacer"></span>
  <a class="btn" href="index.html">All rooms</a>
  <button class="btn" id="reset" type="button">Reset</button>
  <a class="btn primary" id="quote" href="mailto:Info@unitedstoneandcabinet.com">Request a Quote</a>
</header>
<div class="app">
  <aside>
    <div class="room-name" id="room-name">Room Visualizer</div>
    <div class="chosen" id="chosen" aria-live="polite"></div>
    <div class="crumb" id="crumb">Products</div>
    <div class="list" id="list"><p class="hint">Tap a label on the photo to see the colors you can try.</p></div>
    <p class="note">Images are for reference only. Color and pattern can vary from slab to slab. Please call us or visit our Upland showroom to see the material in person.</p>
  </aside>
  <main class="stage"><div class="room" id="room"></div></main>
</div>
<script type="module" src="room.js"></script>
</body>
</html>
